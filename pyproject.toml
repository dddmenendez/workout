[project]
name = "crossfit-coach"
version = "0.1.0"
description = "CrossFit training app based on L1/L2 certification methodology - no external API needed"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "typer>=0.14.0",
    "rich>=13.0.0",
    "alembic>=1.14.0",
    "bcrypt>=4.0.0",
    "python-jose>=3.3.0",
    "python-telegram-bot>=21.0",
    "psycopg2-binary>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]

[project.scripts]
cfc = "crossfit_coach.cli:app"
cfc-bot = "crossfit_coach.telegram_bot:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
