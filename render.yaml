services:
  - type: web
    name: crossfit-coach
    runtime: docker
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: crossfit-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false  # Set manually in Render dashboard

databases:
  - name: crossfit-db
    plan: free
    databaseName: crossfit_coach
